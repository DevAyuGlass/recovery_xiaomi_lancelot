name: Build Si-Phone Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cleanup Environment
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update && sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev libkrb5-dev libgl1-mesa-dev libxml2-utils xsltproc zlib1g-dev python3

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize OrangeFox Source
        run: |
          mkdir -p ~/fox_R11.1
          cd ~/fox_R11.1
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          repo init -u https://gitlab.com/OrangeFox/Manifest.git --depth=1
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch -j$(nproc)

      - name: Import Device Tree
        run: |
          cd ~/fox_R11.1
          mkdir -p device/xiaomi/lancelot
          cp -r $GITHUB_WORKSPACE/* device/xiaomi/lancelot/

      - name: Build Recovery
        run: |
          cd ~/fox_R11.1
          rm -f device/xiaomi/lancelot/vendorsetup.sh
          find device/ -maxdepth 3 -name "vendorsetup.sh" -delete || true
          
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_USE_NANO_EDITOR=true
          export TARGET_SCREEN_HEIGHT=2340
          export TARGET_SCREEN_WIDTH=1080

          # Добавляем lancelot в список комбо вручную перед lunch
          add_lunch_combo omni_lancelot-userdebug || true

          lunch omni_lancelot-userdebug || lunch omni_lancelot-eng
          mka recoveryimage -j$(nproc)

      - name: Upload Recovery Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Si-Phone-Recovery-lancelot
          path: |
            ~/fox_R11.1/out/target/product/lancelot/recovery.img
            ~/fox_R11.1/out/target/product/lancelot/OrangeFox*.zip