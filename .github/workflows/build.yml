name: Build Si-Phone Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cleanup Environment
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update && sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev libkrb5-dev libgl1-mesa-dev libxml2-utils xsltproc zlib1g-dev python3

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize OrangeFox Source
        run: |
          mkdir -p ~/fox_R11.1
          cd ~/fox_R11.1
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          repo init -u https://gitlab.com/OrangeFox/Manifest.git --depth=1
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch -j$(nproc)

      - name: Import Device Tree
        run: |
          cd ~/fox_R11.1
          mkdir -p device/xiaomi/lancelot
          cp -r $GITHUB_WORKSPACE/* device/xiaomi/lancelot/

      - name: Build Recovery
        run: |
          cd ~/fox_R11.1

          # 1. Зачищаем vendorsetup и создаем AndroidProducts.mk
          find device/ -name "vendorsetup.sh" -delete || true

          sed -i 's|vendor/omni/config/common.mk|vendor/fox/config/common.mk|g' device/xiaomi/lancelot/omni_lancelot.mk || true

          cat << 'EOF' > device/xiaomi/lancelot/AndroidProducts.mk
          PRODUCT_MAKEFILES := $(LOCAL_DIR)/omni_lancelot.mk
          COMMON_LUNCH_CHOICES := omni_lancelot-userdebug
          EOF

          # 2. Создаем ПОЛНЫЙ валидный конфиг для release_config во всех папках
          mkdir -p build/release_configs
          mkdir -p build/make/target/product/release_config/release_configs
          
          cat << 'EOF' > build/release_configs/trunk_staging.textproto
          name: "trunk_staging"
          value: "true"
          EOF
          
          cp build/release_configs/trunk_staging.textproto build/make/target/product/release_config/release_configs/trunk_staging.textproto

          # 3. Перехватываем вызов release_config через PATH (абсолютно безопасно)
          mkdir -p ~/mock_bin
          echo '#!/bin/bash' > ~/mock_bin/release_config
          echo 'exit 0' >> ~/mock_bin/release_config
          chmod +x ~/mock_bin/release_config
          export PATH=~/mock_bin:$PATH

          # 4. Подгружаем функции сборки
          source build/envsetup.sh

          # 5. Переменные сборки
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_USE_NANO_EDITOR=true
          export TARGET_SCREEN_HEIGHT=2340
          export TARGET_SCREEN_WIDTH=1080

          export TARGET_PRODUCT=omni_lancelot
          export TARGET_BUILD_VARIANT=userdebug
          export TARGET_RELEASE=trunk_staging
          export TEMPORARY_DISABLE_PATH_RESTRICTIONS=true

          # 6. Запуск сборки
          make recoveryimage -j$(nproc)

      - name: Upload Recovery Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Si-Phone-Recovery-lancelot
          path: |
            ~/fox_R11.1/out/target/product/lancelot/recovery.img
            ~/fox_R11.1/out/target/product/lancelot/OrangeFox*.zip